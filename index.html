 for(const char of value){if(char===':'){body+='<circle cx="'+(x+8)+'" cy="25" r="3" fill="#fffef7"/><circle cx="'+(x+8)+'" cy="48" r="3" fill="#fffef7"/>';x+=17;continue;}
 body+='<g transform="translate('+x+' 0)"><rect width="50" height="73" rx="8" fill="#5e584d" stroke="#c7b799" stroke-opacity=".4"/>';
 for(const key of 'abcdefg')body+='<polygon points="'+shapes[key]+'" fill="'+(segments[Number(char)].includes(key)?'#fffef7':'#ffffff08')+'"/>';
 body+='</g>';x+=54;}
 $('#led-clock').innerHTML='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+(x-4)+' 73">'+body+'</svg>';
 $('.desk-clock').setAttribute('aria-label','남은 시간 '+value+'. 타이머 설정');
}

function renderClock(){$('#clock').textContent=String(Math.floor(remaining/60)).padStart(2,'0')+':'+String(remaining%60).padStart(2,'0');$('#timer-badge').textContent=$('#clock').textContent;renderLED($('#clock').textContent);}
function setMinutes(min){if(!Number.isInteger(min)||min<1||min>180)throw Error('1~180분으로 설정해 주세요.');clearInterval(interval);running=false;duration=remaining=min*60;$('#start').textContent='휴식 시작';$('#timer-note').textContent='시간이 다 되면 움직임과 음악이 멈춰요.';document.querySelectorAll('[data-min]').forEach(b=>b.setAttribute('aria-pressed',Number(b.dataset.min)===min));renderClock();$ ('#timer-badge').hidden=true;}
function tick(){if(!running)return;remaining=Math.max(0,Math.ceil((deadline-Date.now())/1000));renderClock();if(!remaining){running=false;clearInterval(interval);paused=true;animate();musicOn=false;syncAudio();$('#start').textContent='다시 쉬기';$('#timer-note').textContent='잘 쉬었어요. 천천히 돌아오세요.';}}
document.querySelectorAll('[data-min]').forEach(b=>b.onclick=()=>{setMinutes(+b.dataset.min);$('#minutes').value='';});$('#minutes').onchange=e=>{try{setMinutes(Number(e.target.value));e.target.setCustomValidity('');}catch(err){e.target.setCustomValidity(err.message);e.target.reportValidity();}};
$('#start').onclick=()=>{if(running){tick();running=false;clearInterval(interval);$('#start').textContent='이어서 쉬기';}else{if(remaining===0)remaining=duration;deadline=Date.now()+remaining*1000;running=true;$ ('#timer-badge').hidden=false;paused=false;animate();interval=setInterval(tick,250);$('#start').textContent='타이머 멈추기';$('#timer-note').textContent='지금은 잠시, 나를 위한 시간.';}};$('#reset').onclick=()=>setMinutes(duration/60);
renderClock();
let audio=null,master=null,musicOn=false,musicInterval=0,note=0;const notes=[174.61,220,261.63,329.63,261.63,220,196,261.63,293.66,349.23,293.66,220];
function playNote(){if(!audio||audio.state!=='running')return;const now=audio.currentTime,f=notes[note++%notes.length];for(const [ratio,gain] of [[1,.16],[2,.035]]){const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=f*ratio;g.gain.setValueAtTime(0,now);g.gain.linearRampToValueAtTime(gain,now+.12);g.gain.exponentialRampToValueAtTime(.0001,now+5);o.connect(g);g.connect(master);o.start(now);o.stop(now+5.1);o.onended=()=>{o.disconnect();g.disconnect();};}}
async function syncAudio(){clearInterval(musicInterval);$('#bgm').setAttribute('aria-pressed',musicOn);$('#bgm').setAttribute('aria-label',musicOn?'배경음악 끄기':'배경음악 켜기');if(!audio)return;if(musicOn&&!document.hidden){await audio.resume();playNote();musicInterval=setInterval(playNote,2400);}else await audio.suspend();}
$('#bgm').onclick=async()=>{try{if(!audio){audio=new AudioContext();master=audio.createGain();master.gain.value=+$('#volume').value/100;master.connect(audio.destination);}musicOn=!musicOn;await syncAudio();}catch(e){musicOn=false;$('#bgm').setAttribute('aria-pressed','false');$('#timer-note').textContent='이 브라우저에서는 음악을 재생할 수 없어요.';}};$('#volume').oninput=e=>{if(master)master.gain.setTargetAtTime(+e.target.value/100,audio.currentTime,.1);};
window.addEventListener('pagehide',()=>{clearInterval(interval);clearInterval(musicInterval);cancelAnimationFrame(raf);audio?.suspend();});window.addEventListener('pageshow',e=>{if(e.persisted){animate();syncAudio();if(running){tick();if(running)interval=setInterval(tick,250);}}});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'set_relaxation_mode',description:'불, 물, 세탁기, 전자레인지 휴식 모드를 선택합니다.',inputSchema:{type:'object',properties:{mode:{type:'string',enum:Object.keys(modes)}},required:['mode'],additionalProperties:false},annotations:{readOnlyHint:false},execute(input){if(!input||Object.keys(input).some(k=>k!=='mode'))throw Error('잘못된 입력');setMode(input.mode);return {mode};}})).catch(()=>{});}catch{}}
</script></body></html>
